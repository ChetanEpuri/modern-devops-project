name: DevSecOps GitOps Pipeline

on:
  push:
    branches: [ "main" ]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/devops-app

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Run Secret Scanner
      uses: trufflesecurity/trufflehog@main
      with:
        base: ""
        head: "${{ github.sha }}"
        extra_args: --debug --only-verified

    - name: Run Python Security Scan
      run: |
        pip install safety
        safety check || true

    - name: Build Local Image for Scanning
      run: docker build -t devops-app:latest ./backend

    - name: Run Trivy Container Vulnerability Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'devops-app:latest'
        format: 'table'
        exit-code: '0'
        severity: 'CRITICAL,HIGH'

  build-and-push:
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Log in to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: |
          ${{ env.IMAGE_NAME }}:latest
          ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Update Helm chart image tag
      run: |
        sed -i "s/tag: .*/tag: ${{ github.sha }}/" helm/devops-app/values.yaml
        git config user.email "actions@github.com"
        git config user.name "GitHub Actions"
        git add helm/devops-app/values.yaml
        git commit -m "chore: update image tag to ${{ github.sha }}"
        git push
