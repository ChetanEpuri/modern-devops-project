name: DevSecOps GitOps Pipeline

on:
  push:
    branches: [ "main" ]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/devops-app

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Run Secret Scanner
      uses: trufflesecurity/trufflehog@main
      with:
        base: ""
        head: "${{ github.sha }}"
        extra_args: --debug --only-verified

    - name: Run Python Security Scan
      run: |
        pip install safety
        safety check || true

    - name: Build Local Image for Scanning
      run: docker build -t devops-app:latest ./backend

    - name: Run Trivy Container Vulnerability Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'devops-app:latest'
        format: 'table'
        exit-code: '0'
        severity: 'CRITICAL,HIGH'

  build-and-push:
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Log in to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: |
          ${{ env.IMAGE_NAME }}:latest
          ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Pull the latest image
          docker pull ${{ env.IMAGE_NAME }}:latest

          # Stop and remove the old container if running
          docker stop devops-app || true
          docker rm devops-app || true

          # Run the new container
          docker run -d \
            --name devops-app \
            --restart always \
            -p 5000:5000 \
            -e ENV=production \
            ${{ env.IMAGE_NAME }}:latest

          # Verify it's running
          docker ps | grep devops-app