apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: devops-app-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
  - name: devops-app
    rules:
    - alert: HighErrorRate
      expr: |
        rate(app_requests_total{status=~"5.."}[5m]) > 0.1
      for: 2m
      labels:
        severity: critical
      annotations:
        description: "Error rate is above 10% for 2 minutes"

    - alert: HighLatency
      expr: |
        histogram_quantile(0.95, rate(app_request_latency_seconds_bucket[5m])) > 1
      for: 2m
      labels:
        severity: warning
      annotations:
        description: "95th percentile latency is above 1 second"

    - alert: PodCrashLooping
      expr: |
        rate(kube_pod_container_status_restarts_total[15m]) > 0
      for: 5m
      labels:
        severity: critical
      annotations:
        description: "Pod {{ $labels.pod }} is crash looping"

    - alert: HighMemoryUsage
      expr: |
        container_memory_usage_bytes{container="devops-app"} > 200000000
      for: 5m
      labels:
        severity: warning
      annotations:
        description: "Memory usage above 200MB"
